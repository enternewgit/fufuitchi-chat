services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TZ: Asia/Tokyo
    volumes:
      # キャラシート（characters/）と学習データ（processed/、丸暗記率の計算に使う）
      - ./data:/data:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: "3000"
      # サーバー側（Route Handler）からはコンテナ名でGoに届く
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
